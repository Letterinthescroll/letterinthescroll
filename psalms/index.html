<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Psalms — A Letter in the Scroll</title>
    <link rel="icon" type="image/png" href="/media/images/Icon.png">
    <link rel="apple-touch-icon" href="/media/images/Icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="A Letter in the Scroll">
    <meta property="og:title" content="Daily Psalms — A Letter in the Scroll">
    <meta property="og:description" content="Read today's daily Psalms (Tehillim) with Hebrew and English text, and share your reactions with your study group.">
    <meta property="og:image" content="https://www.aletterinthescroll.com/media/images/welcome.jpg">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/shabbat.css">
    <link rel="stylesheet" href="/css/mobile-overrides.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --psalms-deep:    #04131e;
            --psalms-mid:     #082438;
            --psalms-teal:    #0f7b8f;
            --psalms-teal-lt: #1aa3bb;
            --psalms-gold:    #cf9a32;
            --psalms-gold-lt: #f0c254;
            --psalms-cream:   #f5fbfd;
            --psalms-line:    rgba(15, 123, 143, 0.18);
            --psalms-glass:   rgba(255, 255, 255, 0.9);
            --radius-xl:      1.45rem;
            --shadow-xl:      0 24px 56px rgba(4, 30, 46, 0.22);
            --shadow-lg:      0 12px 30px rgba(4, 30, 46, 0.14);
        }

        *, *::before, *::after { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body.psalms-body {
            font-family: 'Manrope', sans-serif;
            padding-bottom: 52px;
            background:
                radial-gradient(900px 500px at 0% 0%, rgba(15, 123, 143, 0.13), transparent 60%),
                radial-gradient(700px 400px at 100% 100%, rgba(207, 154, 50, 0.11), transparent 55%),
                linear-gradient(180deg, #f0fafc 0%, #fdf8ef 50%, #eaf6f9 100%);
            min-height: 100vh;
            color: #061e2b;
        }

        /* ── Psalms hero ────────────────────────────────────────────── */
        .psalms-hero {
            position: relative;
            overflow: hidden;
            /* Static fallback — WebGL canvas covers this when available */
            background: #03111b;
            padding: 3.2rem 2rem 2.8rem;
            text-align: center;
        }

        /* WebGL Grainient canvas */
        #psalms-hero-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 0;
        }

        /* Decorative blobs layered above canvas */
        .psalms-hero::before, .psalms-hero::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }
        .psalms-hero::before {
            width: 500px; height: 400px;
            background: radial-gradient(ellipse, rgba(15, 123, 143, 0.18), transparent 65%);
            top: -60px; left: -80px;
        }
        .psalms-hero::after {
            width: 360px; height: 320px;
            background: radial-gradient(ellipse, rgba(207, 154, 50, 0.15), transparent 65%);
            bottom: -50px; right: -50px;
        }

        .psalms-hero-inner {
            position: relative;
            z-index: 2;
            max-width: 700px;
            margin: 0 auto;
            color: #ffffff;
        }

        .psalms-hero-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--psalms-gold-lt);
            background: rgba(240, 194, 84, 0.12);
            border: 1px solid rgba(240, 194, 84, 0.25);
            border-radius: 999px;
            padding: 0.32rem 0.9rem;
            margin-bottom: 1.2rem;
        }

        .psalms-hero-hebrew {
            font-family: 'Ezra SIL', 'SBL Hebrew', serif;
            font-size: clamp(3.2rem, 8vw, 5.5rem);
            font-weight: 400;
            letter-spacing: 0.04em;
            color: #ffffff;
            line-height: 1.1;
            margin: 0 0 0.35rem;
            text-shadow: 0 2px 28px rgba(15, 123, 143, 0.55), 0 0 60px rgba(207, 154, 50, 0.25);
        }

        .psalms-hero-title {
            font-family: 'Fraunces', serif;
            font-size: clamp(1.25rem, 3vw, 1.75rem);
            font-weight: 600;
            color: rgba(235, 225, 255, 0.92);
            margin: 0 0 1.1rem;
        }

        .psalms-hero-ref-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
            flex-wrap: wrap;
        }

        .psalms-hero-day {
            font-size: 0.82rem;
            font-weight: 700;
            color: rgba(220, 230, 255, 0.55);
            letter-spacing: 0.03em;
        }

        .psalms-hero-day::before {
            content: '·';
            margin-right: 0.65rem;
            font-size: 1rem;
            color: rgba(220, 230, 255, 0.3);
        }

        .psalms-hero-combined {
            margin-top: 0.6rem;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--psalms-gold-lt);
            opacity: 0.7;
        }

        #psalms-ref-display {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--psalms-gold-lt);
            background: rgba(240, 194, 84, 0.1);
            border: 1px solid rgba(240, 194, 84, 0.28);
            padding: 0.4rem 1.05rem;
            border-radius: 999px;
            letter-spacing: 0.01em;
        }

        #psalms-ref-display-he {
            font-family: 'Ezra SIL', 'SBL Hebrew', serif;
            direction: rtl;
            font-size: 0.97rem;
            color: rgba(220, 200, 255, 0.82);
            letter-spacing: 0.01em;
        }

        .psalms-hero-back {
            position: absolute;
            top: 1.1rem;
            left: 1.4rem;
            z-index: 2;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.78rem;
            font-weight: 700;
            color: rgba(220, 200, 255, 0.75);
            text-decoration: none;
            transition: color 0.18s;
        }
        .psalms-hero-back:hover { color: #ffffff; }
        .psalms-hero-back svg { width: 16px; height: 16px; }

        /* ── Main content ─────────────────────────────────────────────── */
        .psalms-main {
            max-width: 820px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        /* ── Loading ──────────────────────────────────────────────────── */
        .psalms-loading-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            padding: 4rem 2rem;
            background: var(--psalms-glass);
            border: 1px solid var(--psalms-line);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
        }

        .psalms-spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(15, 123, 143, 0.2);
            border-top-color: var(--psalms-teal);
            border-radius: 50%;
            animation: spin 0.72s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .psalms-loading-text {
            font-family: 'Fraunces', serif;
            font-size: 1.05rem;
            color: #0a4a58;
        }

        /* ── Error state ──────────────────────────────────────────────── */
        .psalms-error-box {
            background: #fff5f5;
            border: 1px solid rgba(185, 62, 69, 0.25);
            border-radius: var(--radius-xl);
            padding: 2rem;
            text-align: center;
            color: #7a2d32;
        }

        /* ── Chapter header ───────────────────────────────────────────── */
        .psalms-chapter-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 2.4rem 0 0.9rem;
        }
        .psalms-chapter-header:first-child { margin-top: 0.4rem; }

        .psalms-chapter-label {
            font-family: 'Fraunces', serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: #0a3d4d;
            white-space: nowrap;
            background: linear-gradient(135deg, #e4f7fa, #fdf8ef);
            border: 1px solid rgba(15, 123, 143, 0.22);
            border-radius: 999px;
            padding: 0.3rem 1.1rem;
            letter-spacing: 0.01em;
        }

        .psalms-chapter-decoration {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(15, 123, 143, 0.28), transparent);
        }

        /* ── Verse container (inherits from style.css, subtle psalms override) */
        #psalms-verses .verse-container {
            background: var(--psalms-glass);
            border-radius: 1.1rem;
            border: 1px solid rgba(15, 123, 143, 0.1);
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
            margin-bottom: 0.55rem;
        }

        #psalms-verses .verse-container:hover {
            border-color: rgba(15, 123, 143, 0.26);
            box-shadow: 0 4px 16px rgba(8, 70, 88, 0.1);
        }

        #psalms-verses .hebrew-text {
            font-size: 1.2rem;
            line-height: 1.85;
            color: #1a1035;
        }

        /* ── Sefaria credit footer ─────────────────────────────────────── */
        .psalms-sefaria-credit {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.82rem;
            color: #7c6a9a;
        }
        .psalms-sefaria-credit a {
            color: var(--psalms-teal);
            text-decoration: none;
            font-weight: 600;
        }
        .psalms-sefaria-credit a:hover { text-decoration: underline; }

        /* ── Responsive ───────────────────────────────────────────────── */
        @media (max-width: 768px) {
            /* Hero — compact on mobile */
            .psalms-hero { padding: 0.7rem 1rem 0.65rem; }
            .psalms-hero-eyebrow { display: none; }
            .psalms-hero-hebrew { font-size: clamp(1.5rem, 7vw, 2rem); margin-bottom: 0.1rem; }
            .psalms-hero-title { font-size: 0.82rem; margin-bottom: 0.4rem; }
            /* Ref row — stack vertically so Day + Combined don't jostle the pill */
            .psalms-hero-ref-row { flex-direction: column; gap: 0.4rem; align-items: center; }
            #psalms-ref-display { font-size: 0.9rem; padding: 0.34rem 0.9rem; }
            /* Day badge: hide the inline bullet and style it as its own pill */
            .psalms-hero-day::before { display: none; }
            .psalms-hero-day {
                font-size: 0.7rem;
                letter-spacing: 0.04em;
                color: rgba(210, 230, 255, 0.72);
                background: rgba(200, 220, 255, 0.07);
                border: 1px solid rgba(200, 220, 255, 0.15);
                border-radius: 999px;
                padding: 0.2rem 0.72rem;
            }
            #psalms-hero-combined { margin-top: 0.1rem; font-size: 0.58rem; letter-spacing: 0.09em; }

            /* Portion selector — full-width stacked column */
            .psalms-portion-selector-wrap {
                flex-direction: column;
                align-items: stretch;
                width: min(100%, 300px);
                gap: 0.45rem;
                margin-top: 1rem;
            }
            .psalms-daily-btn,
            .psalms-birthday-btn,
            .psalms-portion-btn {
                width: 100%;
                justify-content: center;
                padding: 0.62rem 1rem;
                font-size: 0.82rem;
            }

            /* Today's Significance button */
            #psalms-significance-btn {
                width: min(100%, 300px);
                justify-content: center;
                margin-top: 0.5rem;
                font-size: 0.73rem;
                padding: 0.42rem 0.9rem;
                /* Same readable dark backdrop as other buttons */
                background: rgba(3, 17, 27, 0.6);
                border-color: rgba(240, 194, 84, 0.6);
                color: #f0c254;
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                box-shadow: 0 1px 8px rgba(0,0,0,0.22);
            }

            /* Main content */
            .psalms-main { padding: 1.1rem 0.85rem 3.5rem; }

            /* Chapter headers */
            .psalms-chapter-header { gap: 0.5rem; margin: 1.6rem 0 0.6rem; }
            .psalms-chapter-label { font-size: 0.88rem; padding: 0.22rem 0.85rem; }

            /* Sig modal — align to top so it doesn't go off-screen */
            .psalms-sig-modal-overlay { padding: 0.85rem; align-items: flex-start; padding-top: 1.2rem; }
            .psalms-sig-modal-dialog { max-height: calc(100dvh - 2.4rem); }
            .psalms-sig-card-essence { font-size: 1rem; }
            .psalms-sig-card-summary { font-size: 0.87rem; }
            .psalms-sig-card-takeaway { font-size: 0.84rem; padding: 0.65rem 0.9rem; }

            /* Back link */
            .psalms-hero-back { font-size: 0.72rem; top: 0.8rem; left: 1rem; }

            /* Birthday popover — full viewport width on small screens */
            .psalms-birthday-popover { width: calc(100vw - 1.5rem) !important; left: 0.75rem !important; }
        }

        @media (max-width: 480px) {
            .psalms-hero { padding: 0.5rem 0.85rem 0.45rem; }
            .psalms-hero-hebrew { font-size: 1.3rem; }
            .psalms-hero-title { font-size: 0.75rem; }
            #psalms-ref-display { font-size: 0.74rem; }
            .psalms-portion-selector-wrap { width: 100%; }
            .psalms-main { padding: 1rem 0.75rem 3.5rem; }
            /* Decoration lines distract on tiny screens */
            .psalms-chapter-decoration { display: none; }
        }

        /* ── Significance hero badge (scroll-to link) ────────────────── */
        #psalms-significance-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.42rem;
            font-size: 0.71rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--psalms-gold-lt);
            background: rgba(240, 194, 84, 0.1);
            border: 1px solid rgba(240, 194, 84, 0.28);
            border-radius: 999px;
            padding: 0.34rem 0.9rem;
            margin-top: 1rem;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.18s, border-color 0.18s, transform 0.18s;
        }
        #psalms-significance-btn:hover {
            background: rgba(240, 194, 84, 0.18);
            border-color: rgba(240, 194, 84, 0.45);
            transform: translateY(-1px);
        }
        #psalms-significance-btn svg { opacity: 0.8; }

        /* ── Significance Modal ────────────────────────────────────────── */
        .psalms-sig-modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: rgba(4, 19, 30, 0.72);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            animation: sigModalFadeIn 0.22s ease-out;
        }
        .psalms-sig-modal-overlay.hidden { display: none; }
        @keyframes sigModalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .psalms-sig-modal-dialog {
            position: relative;
            overflow: hidden;
            background: linear-gradient(145deg, #04131e 0%, #082438 55%, #0a2d3d 100%);
            border: 1px solid rgba(15, 123, 143, 0.32);
            border-radius: var(--radius-xl);
            max-width: 560px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 1.7rem 2rem 1.8rem;
            box-shadow: 0 24px 56px rgba(0,0,0,0.4), 0 0 0 1px rgba(240, 194, 84, 0.06);
            animation: sigModalSlideUp 0.25s ease-out;
        }
        @keyframes sigModalSlideUp {
            from { opacity: 0; transform: translateY(16px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .psalms-sig-modal-dialog::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--psalms-teal), var(--psalms-gold-lt), var(--psalms-teal));
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        }
        .psalms-sig-modal-dialog::after {
            content: '';
            position: absolute;
            top: -40px; right: -40px;
            width: 240px; height: 200px;
            background: radial-gradient(ellipse, rgba(207, 154, 50, 0.1), transparent 65%);
            pointer-events: none;
        }
        .psalms-sig-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.1rem;
        }
        .psalms-sig-modal-close {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            padding: 0.4rem;
            transition: background 0.15s, color 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .psalms-sig-modal-close:hover {
            background: rgba(255,255,255,0.14);
            color: #fff;
        }

        .psalms-sig-card-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 0.42rem;
            font-size: 0.67rem;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--psalms-gold-lt);
            background: rgba(240, 194, 84, 0.1);
            border: 1px solid rgba(240, 194, 84, 0.25);
            border-radius: 999px;
            padding: 0.28rem 0.82rem;
            margin-bottom: 1.1rem;
        }

        .psalms-sig-card-essence {
            font-family: 'Fraunces', serif;
            font-size: clamp(1.1rem, 2.8vw, 1.45rem);
            font-weight: 600;
            color: #ffffff;
            line-height: 1.4;
            margin: 0 0 0.9rem;
            text-shadow: 0 1px 14px rgba(15, 123, 143, 0.45);
        }

        .psalms-sig-card-summary {
            font-size: 0.91rem;
            line-height: 1.8;
            color: rgba(210, 240, 248, 0.82);
            margin: 0 0 1.1rem;
        }

        .psalms-sig-card-takeaway {
            border-left: 3px solid var(--psalms-gold);
            padding: 0.75rem 1.1rem;
            font-size: 0.875rem;
            line-height: 1.72;
            color: rgba(240, 215, 155, 0.88);
            font-style: italic;
            background: rgba(207, 154, 50, 0.07);
            border-radius: 0 0.6rem 0.6rem 0;
            margin: 0;
        }

        @media (max-width: 640px) {
            .psalms-sig-card-inner { padding: 1.3rem 1.2rem 1.4rem; }
            .psalms-sig-card-essence { font-size: 1.05rem; }
        }

        /* ── Portion selector ─────────────────────────────────────────── */
        .psalms-portion-selector-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }

        .psalms-daily-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.45rem 1rem;
            border-radius: 999px;
            border: 1px solid rgba(240, 194, 84, 0.7);
            background: rgba(3, 17, 27, 0.6);
            color: #f0c254;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 1px 8px rgba(0,0,0,0.25), inset 0 1px 0 rgba(240,194,84,0.08);
            transition: background 0.18s, border-color 0.18s, color 0.18s, opacity 0.18s, box-shadow 0.18s;
        }
        .psalms-daily-btn:hover {
            background: rgba(3, 17, 27, 0.75);
            border-color: rgba(240, 194, 84, 0.9);
            box-shadow: 0 2px 14px rgba(0,0,0,0.3), 0 0 12px rgba(240,194,84,0.18);
        }

        .psalms-birthday-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.45rem 1rem;
            border-radius: 999px;
            border: 1px solid rgba(52, 211, 153, 0.7);
            background: rgba(3, 17, 27, 0.6);
            color: #6ee7b7;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 1px 8px rgba(0,0,0,0.25), inset 0 1px 0 rgba(52,211,153,0.08);
            transition: background 0.18s, border-color 0.18s, color 0.18s, box-shadow 0.18s;
        }
        .psalms-birthday-btn:hover,
        .psalms-birthday-btn.open {
            background: rgba(3, 17, 27, 0.75);
            border-color: rgba(52, 211, 153, 0.9);
            color: #a7f3d0;
            box-shadow: 0 2px 14px rgba(0,0,0,0.3), 0 0 14px rgba(52, 211, 153, 0.22);
        }

        /* Birthday popover */
        .psalms-birthday-popover {
            border-radius: 1.1rem;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(2, 20, 12, 0.8), 0 0 0 1px rgba(52, 211, 153, 0.12), 0 0 40px rgba(52, 211, 153, 0.06);
        }
        .bday-pop-glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 80% 55% at 50% 0%, rgba(52, 211, 153, 0.22) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        .bday-pop-inner {
            position: relative;
            z-index: 1;
            background: linear-gradient(160deg, #031a0e 0%, #04131e 55%, #021510 100%);
            border: 1px solid rgba(52, 211, 153, 0.2);
            border-radius: 1.1rem;
            padding: 1.3rem 1.25rem 1.1rem;
            text-align: center;
        }
        .bday-pop-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(110, 231, 183, 0.7);
            margin-bottom: 0.85rem;
        }
        .bday-pop-psalm-label {
            font-size: 0.66rem;
            font-weight: 700;
            letter-spacing: 0.14em;

            flex-shrink: 0;

            opacity: 0.8;

    <!-- Grainient WebGL hero background -->
    <script>
    (function() {
        var canvas = document.getElementById('psalms-hero-canvas');
        if (!canvas) return;
        var gl = canvas.getContext('webgl2', { alpha: false, antialias: false, powerPreference: 'low-power' });
        if (!gl) return;

        function hexToRgb(h) {
            var r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h);
            return r ? [parseInt(r[1],16)/255, parseInt(r[2],16)/255, parseInt(r[3],16)/255] : [1,1,1];
        }

        var vs = '#version 300 es\nin vec2 position;\nvoid main(){gl_Position=vec4(position,0.0,1.0);}';

        var fs = `#version 300 es
precision highp float;
uniform vec2 iResolution;
uniform float iTime;
uniform float uTimeSpeed;
uniform float uColorBalance;
uniform float uWarpStrength;
uniform float uWarpFrequency;
uniform float uWarpSpeed;
uniform float uWarpAmplitude;
uniform float uBlendAngle;
uniform float uBlendSoftness;
uniform float uRotationAmount;
uniform float uNoiseScale;
uniform float uGrainAmount;
uniform float uGrainScale;
uniform float uGrainAnimated;
uniform float uContrast;
uniform float uGamma;
uniform float uSaturation;
uniform vec2 uCenterOffset;
uniform float uZoom;
uniform vec3 uColor1;
uniform vec3 uColor2;
uniform vec3 uColor3;
out vec4 fragColor;
#define S(a,b,t) smoothstep(a,b,t)
mat2 Rot(float a){float s=sin(a),c=cos(a);return mat2(c,-s,s,c);}
vec2 hash(vec2 p){p=vec2(dot(p,vec2(2127.1,81.17)),dot(p,vec2(1269.5,283.37)));return fract(sin(p)*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p),u=f*f*(3.0-2.0*f);float n=mix(mix(dot(-1.0+2.0*hash(i+vec2(0.0,0.0)),f-vec2(0.0,0.0)),dot(-1.0+2.0*hash(i+vec2(1.0,0.0)),f-vec2(1.0,0.0)),u.x),mix(dot(-1.0+2.0*hash(i+vec2(0.0,1.0)),f-vec2(0.0,1.0)),dot(-1.0+2.0*hash(i+vec2(1.0,1.0)),f-vec2(1.0,1.0)),u.x),u.y);return 0.5+0.5*n;}
void mainImage(out vec4 o,vec2 C){
  float t=iTime*uTimeSpeed;
  vec2 uv=C/iResolution.xy;
  float ratio=iResolution.x/iResolution.y;
  vec2 tuv=uv-0.5+uCenterOffset;
  tuv/=max(uZoom,0.001);
  float degree=noise(vec2(t*0.1,tuv.x*tuv.y)*uNoiseScale);
  tuv.y*=1.0/ratio;
  tuv*=Rot(radians((degree-0.5)*uRotationAmount+180.0));
  tuv.y*=ratio;
  float frequency=uWarpFrequency;
  float ws=max(uWarpStrength,0.001);
  float amplitude=uWarpAmplitude/ws;
  float warpTime=t*uWarpSpeed;
  tuv.x+=sin(tuv.y*frequency+warpTime)/amplitude;
  tuv.y+=sin(tuv.x*(frequency*1.5)+warpTime)/(amplitude*0.5);
  vec3 colLav=uColor1;
  vec3 colOrg=uColor2;
  vec3 colDark=uColor3;
  float b=uColorBalance;
  float s=max(uBlendSoftness,0.0);
  mat2 blendRot=Rot(radians(uBlendAngle));
  float blendX=(tuv*blendRot).x;
  float edge0=-0.3-b-s;
  float edge1=0.2-b+s;
  float v0=0.5-b+s;
  float v1=-0.3-b-s;
  vec3 layer1=mix(colDark,colOrg,S(edge0,edge1,blendX));
  vec3 layer2=mix(colOrg,colLav,S(edge0,edge1,blendX));
  vec3 col=mix(layer1,layer2,S(v0,v1,tuv.y));
  vec2 grainUv=uv*max(uGrainScale,0.001);
  if(uGrainAnimated>0.5){grainUv+=vec2(iTime*0.05);}
  float grain=fract(sin(dot(grainUv,vec2(12.9898,78.233)))*43758.5453);
  col+=(grain-0.5)*uGrainAmount;
  col=(col-0.5)*uContrast+0.5;
  float luma=dot(col,vec3(0.2126,0.7152,0.0722));
  col=mix(vec3(luma),col,uSaturation);
  col=pow(max(col,0.0),vec3(1.0/max(uGamma,0.001)));
  col=clamp(col,0.0,1.0);
  o=vec4(col,1.0);
}
void main(){vec4 o=vec4(0.0);mainImage(o,gl_FragCoord.xy);fragColor=o;}`;

        function makeShader(type, src) {
            var s = gl.createShader(type);
            gl.shaderSource(s, src); gl.compileShader(s); return s;
        }
        var prog = gl.createProgram();
        gl.attachShader(prog, makeShader(gl.VERTEX_SHADER, vs));
        gl.attachShader(prog, makeShader(gl.FRAGMENT_SHADER, fs));
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
            console.warn('Grainient shader link error:', gl.getProgramInfoLog(prog));
            return;
        }
        gl.useProgram(prog);

        // Full-screen triangle
        var vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        var buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
        var posLoc = gl.getAttribLocation(prog, 'position');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);
        gl.bindVertexArray(null);

        // Collect uniforms
        var U = {};
        ['iTime','iResolution','uTimeSpeed','uColorBalance','uWarpStrength','uWarpFrequency',
         'uWarpSpeed','uWarpAmplitude','uBlendAngle','uBlendSoftness','uRotationAmount',
         'uNoiseScale','uGrainAmount','uGrainScale','uGrainAnimated','uContrast',
         'uGamma','uSaturation','uCenterOffset','uZoom','uColor1','uColor2','uColor3'
        ].forEach(function(n){ U[n] = gl.getUniformLocation(prog, n); });

        // Static uniforms — tuned for Tehillim deep-ocean palette
        gl.uniform1f(U.uTimeSpeed,      0.18);
        gl.uniform1f(U.uColorBalance,   0.05);
        gl.uniform1f(U.uWarpStrength,   1.4);
        gl.uniform1f(U.uWarpFrequency,  3.8);
        gl.uniform1f(U.uWarpSpeed,      1.2);
        gl.uniform1f(U.uWarpAmplitude,  55.0);
        gl.uniform1f(U.uBlendAngle,     25.0);
        gl.uniform1f(U.uBlendSoftness,  0.07);
        gl.uniform1f(U.uRotationAmount, 420.0);
        gl.uniform1f(U.uNoiseScale,     2.2);
        gl.uniform1f(U.uGrainAmount,    0.055);
        gl.uniform1f(U.uGrainScale,     1.8);
        gl.uniform1f(U.uGrainAnimated,  0.0);
        gl.uniform1f(U.uContrast,       1.45);
        gl.uniform1f(U.uGamma,          1.0);
        gl.uniform1f(U.uSaturation,     1.05);
        gl.uniform2f(U.uCenterOffset,   0.0, 0.0);
        gl.uniform1f(U.uZoom,           0.88);
        // color1 = bright teal shimmer, color2 = deep ocean, color3 = dark midnight
        gl.uniform3fv(U.uColor1, new Float32Array(hexToRgb('#0ec4dc')));  // vivid teal
        gl.uniform3fv(U.uColor2, new Float32Array(hexToRgb('#0b4060')));  // deep ocean
        gl.uniform3fv(U.uColor3, new Float32Array(hexToRgb('#010c17')));  // near-black midnight

        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var hero = canvas.parentElement;

        function resize() {
            var w = Math.max(1, Math.round(hero.offsetWidth  * dpr));
            var h = Math.max(1, Math.round(hero.offsetHeight * dpr));
            canvas.width = w; canvas.height = h;
            gl.viewport(0, 0, w, h);
            gl.uniform2f(U.iResolution, w, h);
        }
        var ro = new ResizeObserver(resize);
        ro.observe(hero);
        resize();

        var t0 = performance.now(), raf = 0;
        function loop(t) {
            gl.uniform1f(U.iTime, (t - t0) * 0.001);
            gl.bindVertexArray(vao);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
            gl.bindVertexArray(null);
            raf = requestAnimationFrame(loop);
        }
        raf = requestAnimationFrame(loop);
    })();
    </script>

    <script>
    (function() {
        var wrap  = document.getElementById('psalms-progress-wrap');
        var fill  = document.getElementById('psalms-progress-bar-fill');
        var label = document.getElementById('psalms-progress-label');
        if (!wrap || !fill || !label) return;

        function updateProgress() {
            var verses = document.getElementById('psalms-verses');
            if (!verses || verses.children.length === 0) return;

            var scrollTop = window.scrollY || document.documentElement.scrollTop;
            var docHeight = document.documentElement.scrollHeight - window.innerHeight;
            if (docHeight <= 0) return;

            var pct = Math.round(Math.min(100, Math.max(0, (scrollTop / docHeight) * 100)));
            fill.style.width = pct + '%';
            label.textContent = pct + '%';
            wrap.setAttribute('aria-valuenow', pct);

            // Show bar once user has scrolled past the hero; hide at the very bottom
            var hero = document.querySelector('.psalms-hero');
            var threshold = hero ? hero.offsetHeight : 100;
            var atBottom = pct >= 98;
            wrap.classList.toggle('visible', scrollTop > threshold && !atBottom);
        }

        window.addEventListener('scroll', updateProgress, { passive: true });
        // Also update when verses finish rendering
        var observer = new MutationObserver(updateProgress);
        var target = document.getElementById('psalms-verses');
        if (target) observer.observe(target, { childList: true, subtree: true });
    })();
    </script>
</body>
