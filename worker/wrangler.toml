name = "alits-parsha-reminder"
main = "src/index.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Crons:
#   • Wed 17:00 UTC — chavruta reminder (12:00 PM EST / 1:00 PM EDT)
#   • Thu 06:00 UTC — Hebrew parsha email to private recipients
#                     (1:00 AM EST / 2:00 AM EDT) → runThursdayParshaJob
[triggers]
crons = ["0 17 * * 3", "0 6 * * 4"]

# Routes are configured in the Cloudflare dashboard (Workers Routes) for
# the aletterinthescroll.com zone:
#   *aletterinthescroll.com/unsubscribe*
#   www.aletterinthescroll.com/unsubscribe*
# IMPORTANT: catalyst-magazine.com is on a separate zone and is NOT bound
# to this worker.

[vars]
SITE_URL = "https://www.aletterinthescroll.com"
FROM_EMAIL = "Yair from A Letter in the Scroll <hello@aletterinthescroll.com>"
FIREBASE_PROJECT_ID = "letterinthescroll"

# Secrets — set via `wrangler secret put`:
#   RESEND_API_KEY            — your Resend API key
#   FIREBASE_CLIENT_EMAIL     — the "client_email" field from the Firebase
#                               service account JSON (one short line)
#   FIREBASE_PRIVATE_KEY      — the "private_key" field, as a single line.
#                               Newlines must be either literal \n or real
#                               newlines; the worker accepts both.
#   TEST_TOKEN                — shared token for /test-send and /test-thursday
#   THURSDAY_PARSHA_RECIPIENTS — comma-separated list of email addresses that
#                                receive the Thursday Hebrew-parsha email.
#                                Kept as a secret so the addresses never appear
#                                in the public GitHub repo.
